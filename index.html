    <style>
      body:has(#loading-screen) {
                                overflow: hidden;
                              }

                              #loading-screen {
                                position: fixed;
                                inset: 0;
                                z-index: 9999;
                                background: #04040d;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                                transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
                              }
                              /* ── Star field ── */
                              .ls-stars {
                                position: absolute;
                                inset: 0;
                                overflow: hidden;
                              }
                              .ls-star {
                                position: absolute;
                                border-radius: 50%;
                                background: #fff;
                                animation: ls-twinkle var(--d) ease-in-out infinite var(--delay);
                              }
                              @keyframes ls-twinkle {
                                0%,
                                100% {
                                  opacity: var(--min-op);
                                  transform: scale(1);
                                }
                                50% {
                                  opacity: 1;
                                  transform: scale(1.6);
                                }
                              }

                              /* ── Orbital rings ── */
                              .ls-rings {
                                position: relative;
                                width: 180px;
                                height: 180px;
                                display: flex;
                                align-items: center;
                                justify-content: center;
                              }
                              .ls-ring {
                                position: absolute;
                                border-radius: 50%;
                                border: 1px solid transparent;
                                animation: ls-orbit var(--spd) linear infinite;
                              }
                              .ls-ring-1 {
                                width: 180px;
                                height: 180px;
                                border-color: rgba(0, 238, 255, 0.25);
                                border-top-color: #00eeff;
                                --spd: 2.4s;
                              }
                              .ls-ring-2 {
                                width: 140px;
                                height: 140px;
                                border-color: rgba(168, 85, 247, 0.2);
                                border-right-color: #a855f7;
                                --spd: 1.8s;
                                animation-direction: reverse;
                              }
                              .ls-ring-3 {
                                width: 100px;
                                height: 100px;
                                border-color: rgba(255, 255, 255, 0.1);
                                border-bottom-color: rgba(255, 255, 255, 0.6);
                                --spd: 3.2s;
                              }
                              @keyframes ls-orbit {
                                to {
                                  transform: rotate(360deg);
                                }
                              }

                              /* ── M svg ── */
                              .ls-m {
                                position: relative;
                                z-index: 1;
                                width: 64px;
                                height: 64px;
                                animation: ls-breathe 2.4s ease-in-out infinite;
                              }
                              @keyframes ls-breathe {
                                0%,
                                100% {
                                  opacity: 0.7;
                                  filter: drop-shadow(0 0 8px rgba(0, 238, 255, 0.3));
                                }
                                50% {
                                  opacity: 1;
                                  filter: drop-shadow(0 0 18px rgba(0, 238, 255, 0.7));
                                }
                              }

                              /* ── Glow beneath ── */
                              .ls-glow {
                                position: absolute;
                                width: 220px;
                                height: 220px;
                                border-radius: 50%;
                                background: radial-gradient(
                                  circle,
                                  rgba(0, 238, 255, 0.08) 0%,
                                  rgba(168, 85, 247, 0.06) 50%,
                                  transparent 70%
                                );
                                animation: ls-pulse-glow 2.4s ease-in-out infinite;
                              }
                              @keyframes ls-pulse-glow {
                                0%,
                                100% {
                                  transform: scale(0.9);
                                  opacity: 0.6;
                                }
                                50% {
                                  transform: scale(1.1);
                                  opacity: 1;
                                }
                              }

                              /* ── Label ── */
                              .ls-label {
                                margin-top: 2.5rem;
                                display: flex;
                                align-items: center;
                                gap: 0.5rem;
                                font-family: "Google Sans Flex", system-ui, sans-serif;
                                font-size: 0.7rem;
                                font-weight: 600;
                                letter-spacing: 0.22em;
                                text-transform: uppercase;
                                color: rgba(255, 255, 255, 0.3);
                              }
                              .ls-dot {
                                width: 5px;
                                height: 5px;
                                border-radius: 50%;
                                background: #00eeff;
                                animation: ls-dot-pulse 1.2s ease-in-out infinite;
                              }
                              @keyframes ls-dot-pulse {
                                0%,
                                100% {
                                  opacity: 0.3;
                                  transform: scale(0.8);
                                }
                                50% {
                                  opacity: 1;
                                  transform: scale(1.2);
                                }
                              }
    </style>

  <body>
    <!-- Loading screen -->
    <div id="loading-screen">
      <!-- Star field, generated by inline script below -->
      <div class="ls-stars" id="ls-stars"></div>

      <div style="display: flex; flex-direction: column; align-items: center">
        <div class="ls-rings">
          <div class="ls-glow"></div>
          <div class="ls-ring ls-ring-1"></div>
          <div class="ls-ring ls-ring-2"></div>
          <div class="ls-ring ls-ring-3"></div>
          <svg
            class="ls-m"
            viewBox="0 0 478 478"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <defs>
              <linearGradient id="ls-mg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="45%" stop-color="#00eeff" />
                <stop offset="100%" stop-color="#a855f7" />
              </linearGradient>
            </defs>
            <path
              d="M39 39C69 109 69 319 39 399C79.6667 397 164.5 399 119 439C137 439 159 406 159 359C159 279 150.5 275 99 275C109 255 109 219 99 199C119 209 159 209 179 199L239 419L299 199C319 209 359 209 379 199C369 219 369 255 379 275C327.5 275 319 279 319 359C319 406 341 439 359 439C313.5 399 398.333 397 439 399C409 319 409 109 439 39C418.5 52.5 311.4 71.4 279 39L239 199L199 39C166.6 71.4 59.5 52.5 39 39Z"
              fill="url(#ls-mg)"
            />
          </svg>
        </div>
        <div class="ls-label" role="status" aria-live="polite" aria-label="Loading — entering universe">
          <span class="ls-dot" aria-hidden="true"></span>
          Entering universe
        </div>
      </div>
    </div>

    <script>
      // Scatter stars across the loading screen
                              const container = document.getElementById("ls-stars");
                              for (let i = 0; i < 120; i++) {
                                const s = document.createElement("div");
                                const size = Math.random() * 1.8 + 0.4;
                                s.className = "ls-star";
                                s.style.cssText = [
                                  `width:${size}px`,
                                  `height:${size}px`,
                                  `top:${Math.random() * 100}%`,
                                  `left:${Math.random() * 100}%`,
                                  `--d:${2 + Math.random() * 4}s`,
                                  `--delay:${-Math.random() * 4}s`,
                                  `--min-op:${0.05 + Math.random() * 0.25}`,
                                ].join(";");
                                container.appendChild(s);
                              }
    </script>
