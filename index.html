    <style>
      /* Inline critical styles for loading screen - shows instantly before React loads */
      body:has(#loading-screen) {
        overflow: hidden;
      }
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(to bottom right, #111827, #000);
        transition: opacity 0.3s ease-out;
      }
      #loading-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .spinner-container {
        text-align: center;
      }
      .spinner {
        position: relative;
        margin: 0 auto 1.5rem;
        width: 5rem;
        height: 5rem;
      }
      .spinner-ring {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 4px solid rgba(6, 182, 212, 0.2);
      }
      .spinner-border {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 4px solid transparent;
        border-top-color: #06b6d4;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
      .loading-text {
        font-size: 1.25rem;
        font-weight: 600;
        background: linear-gradient(to right, #22d3ee, #2563eb);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: pulse 2s ease-in-out infinite;
      }
    </style>
