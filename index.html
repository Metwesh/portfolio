    <script>
      // Scatter stars across the loading screen
      const container = document.getElementById("ls-stars");
      for (let i = 0; i < 120; i++) {
        const s = document.createElement("div");
        const size = Math.random() * 1.8 + 0.4;
        s.className = "ls-star";
        s.style.cssText = [
          `width:${size}px`,
          `height:${size}px`,
          `top:${Math.random() * 100}%`,
          `left:${Math.random() * 100}%`,
          `--d:${2 + Math.random() * 4}s`,
          `--delay:${-Math.random() * 4}s`,
          `--min-op:${0.05 + Math.random() * 0.25}`,
        ].join(";");
        container.appendChild(s);
      }
    </script>
